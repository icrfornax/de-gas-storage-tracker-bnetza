name: Deploy Dashboard to Pages

# Der paths-Filter muss jede Datei nennen, die auf der Seite landet.
# Fehlte hier flowlab.js, deployte ein Fix an der Grafik nicht — der Push
# loeste keinen Lauf aus und niemand haette es gemerkt.
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "dashboard.js"
      - "flowlab.js"
      - "flowlab.css"
      - "METHODIK.pdf"
      - "data/**"
      - "scripts/validate_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static dashboard
        run: python scripts/validate_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
